<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <title>ICEBREAKER</title>
    <meta name="description" content="A co-op cyberpunk dungeon delve in a shared terminal. Fight ICE, roll the dice, and talk your way past an AI wyrm." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="rig">
      <header>
        <span class="logo">ICEBREAKER</span>
        <span class="hint">a co-op dungeon delve for 2-4 netrunners · type <b>help</b> anytime</span>
        <button id="sound" class="sound-toggle" type="button" aria-pressed="true">♪ sound on</button>
      </header>
      <section id="hud" aria-live="polite"></section>
      <section class="stage"><canvas id="scene" aria-label="animated view of the delve"></canvas></section>
      <nav id="actions" aria-label="actions"></nav>
      <div id="terminal"></div>
      <form id="cmdbar" autocomplete="off">
        <input id="cmd" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="command or crew chat" aria-label="command" maxlength="300" />
        <button type="submit">send</button>
      </form>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
